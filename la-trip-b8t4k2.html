<title>Trip itinerary</title>
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#faf9f6;color:#20242a;

    background:#faf9f6;text-align:center;letter-spacing:.06em}

    border:0;border-radius:8px;cursor:pointer}
  button:disabled{opacity:.55}

</style>
