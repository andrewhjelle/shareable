<title>Trip itinerary</title>
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#faf9f6;color:#20242a;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme:dark){body{background:#15181b;color:#e7e5e0}
    .card{background:#1b1f23 !important;border-color:#2c3237 !important}

  p{margin:0 0 20px;font-size:14px;color:#8a929c}
  input{width:100%;padding:12px 14px;font-size:16px;border:1px solid #e4e0d8;border-radius:8px;
    background:#faf9f6;text-align:center;letter-spacing:.06em}
  button{margin-top:12px;width:100%;padding:12px;font:600 15px inherit;color:#fff;background:#1d5b73;
    border:0;border-radius:8px;cursor:pointer}
  button:disabled{opacity:.55}
  .err{color:#9c4221;font-size:13.5px;min-height:18px;margin-top:10px}
</style>

const ITER=200000;
async function unlock(){
  const btn=document.getElementById('go'),err=document.getElementById('err');
  btn.disabled=true;err.textContent='';
  try{
    const raw=Uint8Array.from(atob(BLOB),c=>c.charCodeAt(0));
    const salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
    const pw=new TextEncoder().encode(document.getElementById('pw').value);
    const km=await crypto.subtle.importKey('raw',pw,'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:salt,iterations:ITER},km,256);
    const key=await crypto.subtle.importKey('raw',bits,'AES-GCM',false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
    document.open();document.write(new TextDecoder().decode(pt));document.close();
  }catch(e){err.textContent='Wrong password, try again.';btn.disabled=false;}
}
