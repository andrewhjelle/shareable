<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Family Reading Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --tape:#17141a;--ink:#211d20;--cream:#f2e0c8;--cream2:#e9d5ba;
  --lip:#d96b52;--lip2:#c24f3d;--cobalt:#4a6fb2;--signal:#cf4a2e;
  --osd:#f4f1e4;--skin:#edbd97;--blush:#e58087;
  --rule-soft:rgba(33,29,32,0.35);--rule-faint:rgba(33,29,32,0.18);
  --mut:#7a6a5e;
  --zada:#a855f7;--kai:#4a6fb2;--andrew:#c24f3d;--debbie:#d96b52;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{background:var(--tape);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:repeating-linear-gradient(180deg,transparent 0 3px,rgba(10,8,12,.11) 3px 4px)}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 30% 20%,rgba(217,107,82,.08),transparent 60%),radial-gradient(ellipse at 80% 90%,rgba(74,111,178,.08),transparent 60%)}
a{color:var(--lip2);text-decoration:none;border-bottom:1px dotted rgba(194,79,61,.5)}
a:hover{color:var(--ink);border-bottom-color:var(--ink)}
::selection{background:var(--lip);color:var(--cream)}

.wrap{position:relative;z-index:2;max-width:1400px;margin:0 auto;padding:20px 22px 80px}
h1{font-family:"Anton",sans-serif;font-size:38px;letter-spacing:.02em;text-transform:uppercase;transform:skewX(-5deg);color:var(--skin);text-shadow:3px 0 0 rgba(194,79,61,.55),-3px 0 0 rgba(74,111,178,.45);text-align:left;margin:6px 0 6px;line-height:1;background:none;-webkit-background-clip:initial;background-clip:initial}
.subtitle{font-family:"DotGothic16",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--osd);margin-bottom:16px;text-align:left}

.tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-start;margin-bottom:16px}
.tab{border:1.5px solid rgba(244,241,228,.35);cursor:pointer;padding:6px 12px;border-radius:2px;background:rgba(23,20,26,.7);color:var(--osd);font-family:"DotGothic16",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.tab:hover{color:var(--skin);border-color:var(--skin)}
.tab .age{opacity:.6;font-size:10px}
.tab[data-active="true"]{background:var(--lip2);border-color:var(--lip2);color:var(--cream)}
.tab[data-tab="zada"][data-active="true"]{background:var(--zada);border-color:var(--zada);color:var(--cream)}
.tab[data-tab="kai"][data-active="true"]{background:var(--kai);border-color:var(--kai);color:var(--cream)}
.tab[data-tab="andrew"][data-active="true"]{background:var(--andrew);border-color:var(--andrew);color:var(--cream)}
.tab[data-tab="debbie"][data-active="true"]{background:var(--debbie);border-color:var(--debbie);color:var(--cream)}
.tab[data-modebtn="reading"][data-active="true"]{background:var(--cobalt);border-color:var(--cobalt);color:var(--cream)}
.tab[data-modebtn="games"][data-active="true"]{background:#4a8f5a;border-color:#4a8f5a;color:var(--cream)}
.modebar{margin-bottom:12px}

section{margin-bottom:22px}
h2{font-family:"Anton",sans-serif;font-size:22px;letter-spacing:.02em;text-transform:uppercase;transform:skewX(-5deg);color:var(--cream);margin:14px 0 8px;display:flex;align-items:baseline;gap:8px;line-height:1.05;text-shadow:2px 0 0 rgba(194,79,61,.4)}
h2 .dot{display:none}
h2.reading{color:var(--skin)}
h2.finished{color:var(--cream2);opacity:.75}
h2.ordered{color:var(--skin)}
h2.selected{color:var(--skin)}
h2.rec{color:var(--cream)}
h2.fav{color:var(--skin)}
.empty{color:var(--osd);opacity:.65;font-size:13px;font-style:italic;padding:8px 0}

/* Cards — dense, one-line where possible */
#content{display:grid;grid-template-columns:1fr;gap:0}
section.rec-lead .cards-grid,
section h2.rec + .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.card{position:relative;background:var(--cream);color:var(--ink);border:2px solid var(--ink);border-radius:2px 8px 3px 8px;padding:10px 12px;margin-bottom:6px;box-shadow:3px 3px 0 rgba(33,29,32,.75)}
.card.reading{border-color:var(--cobalt)}
.card.finished{opacity:.7}
.card .row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;min-width:0}
.card .row > div:first-child{min-width:0;flex:1 1 auto}
.card .title{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:13.5px;line-height:1.25;margin:0;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .author{color:var(--mut);font-family:"DotGothic16",monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .pitch{font-size:12px;color:var(--ink);margin:5px 0 0;line-height:1.4;display:none}
.card:hover .pitch,.card.open .pitch{display:block}
.card .meta{color:var(--mut);font-family:"DotGothic16",monospace;font-size:10px;letter-spacing:.06em;margin-top:3px}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0 0}
.badge{font-family:"DotGothic16",monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:2px;background:var(--cream2);color:var(--ink);border:1px solid var(--ink);white-space:nowrap}
.badge.novel{background:#6e8b5c;color:var(--cream);border-color:#6e8b5c}
.badge.graphic{background:var(--zada);color:var(--cream);border-color:var(--zada)}
.badge.manga{background:#c94b7a;color:var(--cream);border-color:#c94b7a}
.badge.movie{background:var(--cobalt);color:var(--cream);border-color:var(--cobalt)}
.badge.edgy{background:var(--signal);color:var(--cream);border-color:var(--signal)}
.badge.audio{background:var(--lip);color:var(--cream);border-color:var(--lip)}
.badge.match{background:var(--lip2);color:var(--cream);border-color:var(--lip2)}
.badge.verdict{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.badge.bounced{background:var(--signal);color:var(--cream);border-color:var(--signal)}
.badge.cp{background:#4a8f5a;color:var(--cream);border-color:#4a8f5a}
.badge.free{background:var(--lip);color:var(--cream);border-color:var(--lip)}
.badge.warn{background:var(--signal);color:var(--cream);border-color:var(--signal)}
.btn{border:1.5px solid var(--ink);cursor:pointer;font-family:"DotGothic16",monospace;font-weight:400;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;border-radius:2px 5px 2px 5px;color:var(--cream);white-space:nowrap;background:var(--ink);flex-shrink:0}
.btn:hover{opacity:.9;transform:translate(-1px,-1px)}
.btn.available{background:var(--lip);border-color:var(--lip)}
.btn.selected{background:var(--cobalt);border-color:var(--cobalt)}
.btn.ordered{background:#4a8f5a;border-color:#4a8f5a}
.btn.reading{background:var(--zada);border-color:var(--zada)}
.btn.finished{background:var(--mut);border-color:var(--mut)}

.stars{display:inline-flex;gap:2px;margin-top:6px;align-items:center}
.stars .lbl{font-family:"DotGothic16",monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-right:6px}
.star{background:none;border:0;color:var(--mut);font-size:16px;cursor:pointer;padding:0 1px}
.star.on{color:var(--lip)}

.librarian{background:var(--cream2);color:var(--ink);border:2px solid var(--ink);border-radius:2px 8px 3px 8px;padding:12px;margin-bottom:8px;box-shadow:3px 3px 0 rgba(33,29,32,.75)}
.librarian .lbl{font-family:"Anton",sans-serif;font-size:16px;text-transform:uppercase;transform:skewX(-5deg);color:var(--lip2);margin:0 0 6px;text-align:left}
.librarian ul{margin:0;padding:0;list-style:none}
.librarian li{padding:5px 0;border-top:1px dashed var(--rule-soft);font-size:13px}
.librarian li:first-child{border-top:0}
.librarian .t{font-weight:700}
.librarian .a{color:var(--mut);font-family:"DotGothic16",monospace;font-size:10px;text-transform:uppercase;letter-spacing:.06em}

.favlist{display:flex;flex-wrap:wrap;gap:6px}
.favlist .fav{background:var(--lip2);color:var(--cream);border:1px solid var(--lip2);padding:3px 10px;border-radius:2px 5px 2px 5px;font-family:"DotGothic16",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase}

.verdictbox{background:var(--cream2);border:1.5px solid var(--ink);border-radius:2px 6px 2px 6px;padding:6px 10px;margin-top:5px;font-size:12px;color:var(--ink)}
.verdictbox strong{color:var(--lip2)}

.crewbox{background:var(--cream);border:2px solid var(--ink);border-radius:2px 8px 3px 8px;padding:12px;margin-bottom:14px;font-size:12.5px;box-shadow:3px 3px 0 rgba(33,29,32,.75)}
.crewbox .who{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.crewbox .who span{background:var(--cream2);color:var(--ink);border:1px solid var(--ink);padding:2px 8px;border-radius:2px;font-family:"DotGothic16",monospace;font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.crewbox .rule{color:var(--mut);font-size:12px}
.deadlist{color:var(--mut);font-size:11.5px;line-height:1.5;font-family:"DotGothic16",monospace;letter-spacing:.04em}
.deadlist strong{color:var(--ink);text-transform:uppercase}

/* Top-of-page nav pill */
.wrap > div:first-child{background:rgba(23,20,26,.7);border:1px solid rgba(244,241,228,.14);border-bottom-width:2px !important;padding:10px 14px !important;margin-bottom:16px !important;border-radius:2px 8px 2px 8px}
.wrap > div:first-child a{color:var(--osd) !important;font-family:"DotGothic16",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;border-bottom:0 !important}
.wrap > div:first-child a:hover{color:var(--skin) !important}
.wrap > div:first-child span{color:var(--osd) !important;opacity:.4}
.hubnav{display:flex;justify-content:center;gap:2px;flex-wrap:wrap;font-family:"DotGothic16",monospace;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase}
.hubnav a{color:#f4f1e4;text-decoration:none;padding:5px 12px;border:1px solid transparent;border-radius:2px;transition:color .15s,border-color .15s}
.hubnav a:hover{color:#edbd97;border-color:rgba(237,189,151,.4)}
.hubnav a.here{color:#edbd97;border-color:#edbd97}

</style>

</head>

const NEXT_STATE = {
  available: { next: "selected", label: "Select",        cls: "available" },
  selected:  { next: "ordered",  label: "Mark Ordered",  cls: "selected"  },
  ordered:   { next: "reading",  label: "Start Reading", cls: "ordered"   },

};

const STATE_KEY  = "familyBookStates";
const RATING_KEY = "familyBookRatings";

let activeMode  = localStorage.getItem("familyMode") || "reading";
let activeTab   = localStorage.getItem("familyActiveTab") || "andrew";
let bookStates  = JSON.parse(localStorage.getItem(STATE_KEY)  || "{}");
let bookRatings = JSON.parse(localStorage.getItem(RATING_KEY) || "{}");

function save() {
  localStorage.setItem(STATE_KEY,  JSON.stringify(bookStates));
  localStorage.setItem(RATING_KEY, JSON.stringify(bookRatings));
  localStorage.setItem("familyActiveTab", activeTab);
  localStorage.setItem("familyMode", activeMode);
}

function bookKey(kid, title)      { return kid + "|" + title; }
function getState(kid, title)     { return bookStates[bookKey(kid,title)]  || "available"; }
function setState(kid, title, s)  { bookStates[bookKey(kid,title)]  = s; save(); render(); }
function getRating(kid, title)    { return bookRatings[bookKey(kid,title)] || 0; }
function setRating(kid, title, r) {
  const cur = getRating(kid, title);
  bookRatings[bookKey(kid,title)] = (r === cur ? 0 : r);
  save(); render();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function badgeHTML(book, isKid) {
  const b = [];
  if (isKid && book.format && FORMAT[book.format]) {
    b.push(`<span class="badge ${FORMAT[book.format].cls}">${FORMAT[book.format].label}</span>`);
  }
  if (book.movieReward)  b.push(`<span class="badge movie">🎬 Movie!</span>`);
  if (book.transgressive) b.push(`<span class="badge edgy">🔥 Edgy</span>`);
  if (book.audiobook)    b.push(`<span class="badge audio">🎧 Audiobook</span>`);
  if (book.match)        b.push(`<span class="badge match">${escapeHtml(book.match)}</span>`);
  (book.tags || []).forEach(t => b.push(`<span class="badge">${escapeHtml(t)}</span>`));
  return `<div class="badges">${b.join("")}</div>`;
}

function starsHTML(kid, title) {
  const r = getRating(kid, title);
  let out = `<div class="stars"><span class="lbl">Rate it:</span>`;
  for (let i = 1; i <= 5; i++) {
    out += `<button class="star ${i <= r ? "on" : ""}" data-star="${i}" data-kid="${kid}" data-title="${escapeHtml(title)}">★</button>`;
  }
  out += `</div>`;
  return out;
}

function bookCardHTML(book, kid, isKid) {
  const state = getState(kid, book.title);
  const conf  = NEXT_STATE[state];
  const showBtn = isKid;
  return `
    <div class="card ${state}">
      <div class="row">
        <div style="flex:1; min-width:0;">
          <p class="title">${escapeHtml(book.title)}</p>
          <p class="author">${escapeHtml(book.author)}</p>
          ${badgeHTML(book, isKid)}
          ${book.pitch ? `<p class="pitch">${escapeHtml(book.pitch)}</p>` : ""}
          ${(book.pages || book.seriesInfo) ? `<div class="meta">${escapeHtml(book.pages||"")}${book.seriesInfo ? " • " + escapeHtml(book.seriesInfo) : ""}</div>` : ""}
          ${state === "finished" ? starsHTML(kid, book.title) : ""}
        </div>
        ${showBtn ? `<button class="btn ${conf.cls}" data-advance data-kid="${kid}" data-title="${escapeHtml(book.title)}" data-next="${conf.next}">${conf.label}</button>` : ""}
      </div>
    </div>`;
}

function sectionHTML(title, kls, cards, empty) {
  return `
    <section>
      <h2 class="${kls}"><span class="dot"></span>${title}</h2>
      ${cards.length ? `<div class="cards-grid">${cards.join("")}</div>` : `<p class="empty">${empty}</p>`}
    </section>`;
}

function gameCardHTML(g) {
  const state = getState("games", g.title);
  const conf  = GAME_NEXT[state];
  const badges = [
    `<span class="badge cp">🔀 Full Crossplay</span>`,
    g.price === "Free" ? `<span class="badge free">Free</span>` : `<span class="badge match">${escapeHtml(g.price)}</span>`,
    `<span class="badge">${escapeHtml(g.players)}</span>`,
    ...(g.tags || []).map(t => `<span class="badge">${escapeHtml(t)}</span>`),
  ].join("");
  return `
    <div class="card ${state}">
      <div class="row">
        <div style="flex:1; min-width:0;">
          <p class="title">${escapeHtml(g.title)}</p>
          <div class="badges">${badges}</div>
          <p class="pitch">${escapeHtml(g.pitch)}</p>
          ${state === "played" ? starsHTML("games", g.title) : ""}
        </div>
        <button class="btn ${conf.cls}" data-advance data-kid="games" data-title="${escapeHtml(g.title)}" data-next="${conf.next}">${conf.label}</button>
      </div>
    </div>`;
}

function renderGames() {

  const playing = byState("playing"), shortlist = byState("shortlist"),

    </div>`);

  if (playing.length)
    parts.push(sectionHTML("Currently Playing", "reading", playing.map(gameCardHTML), ""));

  parts.push(`

        </div>`).join("")}
    </section>`);

  parts.push(sectionHTML("✓ Shortlist — Next Game Night", "selected",
    shortlist.map(gameCardHTML), "Shortlist games from the recommendations below."));

  parts.push(sectionHTML("🎯 Recommended", "rec", avail.map(gameCardHTML), "All shortlisted or played!"));

  if (done.length)

  parts.push(`
    <section>
      <h2 class="fav">🚫 Ruled Out / Parked</h2>
      <div class="deadlist">${gamesDead.map(d => `<div><strong>${escapeHtml(d.title)}</strong> — ${escapeHtml(d.why)}</div>`).join("")}</div>

  document.getElementById("content").innerHTML = parts.join("");
}

    } else {
      inner = `<p class="empty">No books on order</p>`;
    }
    parts.push(`<section><h2 class="ordered">📋 Ordered from Library</h2>${inner}</section>`);
  }

  // Selected
  if (selected.length || isKid) {
    parts.push(sectionHTML("✓ Selected — Ready to Order", "selected",
      selected.map(b => bookCardHTML(b, kid, isKid)),
      "Select books from recommendations below!"));
  }

  // Recommended
  parts.push(sectionHTML("🎯 Recommended", "rec",
    available.map(b => bookCardHTML(b, kid, isKid)),
    "All recommendations selected or finished!"));

  // Finished (catalog-side, with ratings)
  if (finished.length) {
    parts.push(sectionHTML("⭐ Finished", "finished",
      finished.map(b => bookCardHTML(b, kid, isKid)), ""));
  }

  // Favorites chips
  if (favorites[kid]?.length) {
    parts.push(`
      <section>
        <h2 class="fav">🔥 All-Time Favorites</h2>
        <div class="favlist">${favorites[kid].map(f => `<span class="fav">${escapeHtml(f)}</span>`).join("")}</div>
      </section>`);
  }

  document.getElementById("content").innerHTML = parts.join("");
}

/* ============================================================
   EVENTS
   ============================================================ */

document.addEventListener("click", (e) => {
  const modeBtn = e.target.closest("[data-modebtn]");
  if (modeBtn) { activeMode = modeBtn.dataset.modebtn; save(); render(); return; }

  const tab = e.target.closest(".tab");
  if (tab && tab.dataset.tab) { activeTab = tab.dataset.tab; save(); render(); return; }

  const adv = e.target.closest("[data-advance]");
  if (adv) { setState(adv.dataset.kid, adv.dataset.title, adv.dataset.next); return; }

  const star = e.target.closest(".star");
  if (star) { setRating(star.dataset.kid, star.dataset.title, +star.dataset.star); return; }
});

render();
</script>

<script>
document.addEventListener('click', function(e){
  var card = e.target.closest('.card');
  if (card && !e.target.closest('button') && !e.target.closest('a')) card.classList.toggle('open');
});
</script>
</body>
</html>
