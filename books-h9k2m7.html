    pitch: "The chill-night option: explore the galaxy, build a base together, low stakes. Space AND hangout — double Jason-approved. Full crossplay." },
  { title: "Overcooked! All You Can Eat", price: "$40 (often ~$15)", players: "4-player co-op",
    tags: ["Hangout ✓","Chaotic Kitchen Co-op","Friendship Stress Test"],
    pitch: "Cooperative kitchen chaos — the classic scream-at-each-other-laughing game. The All You Can Eat edition has full crossplay across PC/PS5/Xbox." },
  { title: "Phasmophobia", price: "$20", players: "4-player co-op",
    tags: ["Hangout-ish","Built-in Proximity Voice","Jason-Check: Paranormal ≠ Space"],
    pitch: "The VRChat-audio itch, scratched: real in-game proximity voice — whisper in a dark hallway and the ghost hears you too. Not space/future, but its comedy-through-fear loop is closer to a hangout game than a shooter. Ask Jason before buying." },
];

/* Ruled out — platform walls or PvP. Kept so nobody re-litigates them. */
const gamesDead = [
  { title: "Remnant", why: "Played it — Jason didn't like it. Confirmed the rule: nothing soulslike or dark-fantasy." },
  { title: "Warframe", why: "Tried it — never truly clicked. The free-to-play grind needs a wiki guy nobody wanted to be. Not worth a third attempt." },
  { title: "Ready or Not / Payday 3", why: "Cut by the Jason filter — modern-day tactical/crime, not hangout or space/future. (GTA Online worked because it was a hangout sandbox, not a mission grind.)" },
  { title: "Sea of Thieves", why: "Cut by the Jason filter — pirates are the wrong century entirely." },
  { title: "Destiny 2", why: "Jason and Brian played it; Andrew couldn't get into it. Two of three isn't a crew game." },
  { title: "Halo Infinite", why: "Andrew owns it, but the ship has sailed — the moment passed. Parked, not deleted, since it costs nothing to revisit." },
  { title: "Among Us", why: "Needs 5+ players for real paranoia — a bigger-group game, not a trio game." },
  { title: "Jackbox Party Pack", why: "DEEP BACKLOG — not ruled out, just not soon. The one-copy-plus-phones trick still makes it the cheapest experiment whenever a hangout night needs a game." },
  { title: "ARC Raiders", why: "PvPvE — other player squads hunt you in every raid. Great game, wrong vibe for a PvE crew." },
  { title: "Battlefield 6 / Warzone / Rocket League", why: "Parked — PvP, not the vibe right now." },
  { title: "Grounded", why: "Andrew likes it, but survival-building probably isn't Jason's wheelhouse. Parked for this crew — could be a different-friends or family game." },
  { title: "Deep Rock Galactic", why: "The perfect PvE game on paper, but Steam PC can't join consoles (only Microsoft Store PC ↔ Xbox). Verified 2026-07." },
  { title: "Lethal Company / R.E.P.O. / Content Warning", why: "The proximity-voice co-op hits are all PC only." },
  { title: "Hell Let Loose", why: "Console-to-console crossplay only — PC is walled off." },
];

const GAME_NEXT = {
  available: { next: "shortlist", label: "Shortlist",   cls: "available" },
  shortlist: { next: "playing",   label: "We Got It",   cls: "selected"  },
  playing:   { next: "played",    label: "Mark Played", cls: "reading"   },
  played:    { next: "available", label: "Reset",       cls: "finished"  },
};

/* ============================================================
   RENDERER
   ============================================================ */

const FORMAT = {
  novel:   { label: "📖 Chapter Book",  cls: "novel"   },
  graphic: { label: "🎨 Graphic Novel", cls: "graphic" },
  manga:   { label: "🇯🇵 Manga",        cls: "manga"   },
};

const NEXT_STATE = {
  available: { next: "selected", label: "Select",        cls: "available" },
  selected:  { next: "ordered",  label: "Mark Ordered",  cls: "selected"  },
  ordered:   { next: "reading",  label: "Start Reading", cls: "ordered"   },
  reading:   { next: "finished", label: "Finished!",     cls: "reading"   },
  finished:  { next: "available",label: "Reset",         cls: "finished"  },
};

const STATE_KEY  = "familyBookStates";
const RATING_KEY = "familyBookRatings";

let activeMode  = localStorage.getItem("familyMode") || "reading";
let activeTab   = localStorage.getItem("familyActiveTab") || "andrew";
let bookStates  = JSON.parse(localStorage.getItem(STATE_KEY)  || "{}");
let bookRatings = JSON.parse(localStorage.getItem(RATING_KEY) || "{}");

function save() {
  localStorage.setItem(STATE_KEY,  JSON.stringify(bookStates));
  localStorage.setItem(RATING_KEY, JSON.stringify(bookRatings));
  localStorage.setItem("familyActiveTab", activeTab);
  localStorage.setItem("familyMode", activeMode);
}

function bookKey(kid, title)      { return kid + "|" + title; }
function getState(kid, title)     { return bookStates[bookKey(kid,title)]  || "available"; }
function setState(kid, title, s)  { bookStates[bookKey(kid,title)]  = s; save(); render(); }
function getRating(kid, title)    { return bookRatings[bookKey(kid,title)] || 0; }
function setRating(kid, title, r) {
  const cur = getRating(kid, title);
  bookRatings[bookKey(kid,title)] = (r === cur ? 0 : r);
  save(); render();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function badgeHTML(book, isKid) {
  const b = [];
  if (isKid && book.format && FORMAT[book.format]) {
    b.push(`<span class="badge ${FORMAT[book.format].cls}">${FORMAT[book.format].label}</span>`);
  }
  if (book.movieReward)  b.push(`<span class="badge movie">🎬 Movie!</span>`);
  if (book.transgressive) b.push(`<span class="badge edgy">🔥 Edgy</span>`);
  if (book.audiobook)    b.push(`<span class="badge audio">🎧 Audiobook</span>`);
  if (book.match)        b.push(`<span class="badge match">${escapeHtml(book.match)}</span>`);
  (book.tags || []).forEach(t => b.push(`<span class="badge">${escapeHtml(t)}</span>`));
  return `<div class="badges">${b.join("")}</div>`;
}

function starsHTML(kid, title) {
  const r = getRating(kid, title);
  let out = `<div class="stars"><span class="lbl">Rate it:</span>`;
  for (let i = 1; i <= 5; i++) {
    out += `<button class="star ${i <= r ? "on" : ""}" data-star="${i}" data-kid="${kid}" data-title="${escapeHtml(title)}">★</button>`;
  }
  out += `</div>`;
  return out;
}

function bookCardHTML(book, kid, isKid) {
  const state = getState(kid, book.title);
  const conf  = NEXT_STATE[state];
  const showBtn = isKid;
  return `
    <div class="card ${state}">
      <div class="row">
        <div style="flex:1; min-width:0;">
          <p class="title">${escapeHtml(book.title)}</p>
          <p class="author">${escapeHtml(book.author)}</p>
          ${badgeHTML(book, isKid)}
          ${book.pitch ? `<p class="pitch">${escapeHtml(book.pitch)}</p>` : ""}
          ${(book.pages || book.seriesInfo) ? `<div class="meta">${escapeHtml(book.pages||"")}${book.seriesInfo ? " • " + escapeHtml(book.seriesInfo) : ""}</div>` : ""}
          ${state === "finished" ? starsHTML(kid, book.title) : ""}
        </div>
        ${showBtn ? `<button class="btn ${conf.cls}" data-advance data-kid="${kid}" data-title="${escapeHtml(book.title)}" data-next="${conf.next}">${conf.label}</button>` : ""}
      </div>
    </div>`;
}

function sectionHTML(title, kls, cards, empty) {
  return `
    <section>
      <h2 class="${kls}"><span class="dot"></span>${title}</h2>
      ${cards.length ? cards.join("") : `<p class="empty">${empty}</p>`}
    </section>`;
}

function gameCardHTML(g) {
  const state = getState("games", g.title);
  const conf  = GAME_NEXT[state];
  const badges = [
    `<span class="badge cp">🔀 Full Crossplay</span>`,
    g.price === "Free" ? `<span class="badge free">Free</span>` : `<span class="badge match">${escapeHtml(g.price)}</span>`,
    `<span class="badge">${escapeHtml(g.players)}</span>`,
    ...(g.tags || []).map(t => `<span class="badge">${escapeHtml(t)}</span>`),
  ].join("");
  return `
    <div class="card ${state}">
      <div class="row">
        <div style="flex:1; min-width:0;">
          <p class="title">${escapeHtml(g.title)}</p>
          <div class="badges">${badges}</div>
          <p class="pitch">${escapeHtml(g.pitch)}</p>
          ${state === "played" ? starsHTML("games", g.title) : ""}
        </div>
        <button class="btn ${conf.cls}" data-advance data-kid="games" data-title="${escapeHtml(g.title)}" data-next="${conf.next}">${conf.label}</button>
      </div>
    </div>`;
}

function renderGames() {
  const byState = s => games.filter(g => getState("games", g.title) === s);
  const playing = byState("playing"), shortlist = byState("shortlist"),
        avail = byState("available"), done = byState("played");
  const parts = [];

  parts.push(`
    <div class="crewbox">
      <div class="who">${crew.map(c => `<span><strong>${escapeHtml(c.name)}</strong> · ${escapeHtml(c.platforms)}</span>`).join("")}</div>
      <div class="rule">${escapeHtml(crewRule)}</div>
    </div>`);

  if (playing.length)
    parts.push(sectionHTML("Currently Playing", "reading", playing.map(gameCardHTML), ""));

  parts.push(`
    <section>
      <h2 class="finished">Played Together</h2>
      ${gamesPlayed.map(g => `
        <div class="card finished">
          <p class="title">${escapeHtml(g.title)}</p>
          <div class="verdictbox">${g.warn ? "<strong>Heads up:</strong> " : ""}${escapeHtml(g.note)}</div>
        </div>`).join("")}
    </section>`);

  parts.push(sectionHTML("✓ Shortlist — Next Game Night", "selected",
    shortlist.map(gameCardHTML), "Shortlist games from the recommendations below."));

  parts.push(sectionHTML("🎯 Recommended", "rec", avail.map(gameCardHTML), "All shortlisted or played!"));

  if (done.length)
    parts.push(sectionHTML("⭐ Finished", "finished", done.map(gameCardHTML), ""));

  parts.push(`
    <section>
      <h2 class="fav">🚫 Ruled Out / Parked</h2>
      <div class="deadlist">${gamesDead.map(d => `<div><strong>${escapeHtml(d.title)}</strong> — ${escapeHtml(d.why)}</div>`).join("")}</div>
    </section>`);

  document.getElementById("content").innerHTML = parts.join("");
}

function render() {
  document.getElementById("lastUpdated").textContent = "Last updated: " + LAST_UPDATED;

  document.getElementById("modeToggle").innerHTML = `
    <button class="tab" data-modebtn="reading" data-active="${activeMode === "reading"}">📚 Reading</button>
    <button class="tab" data-modebtn="games"   data-active="${activeMode === "games"}">🎮 Game Nights</button>`;
  document.getElementById("pageTitle").textContent =
    activeMode === "games" ? "🎮 Game Nights — Andrew · Jason · Brian" : "📚 Family Reading Dashboard";

  if (activeMode === "games") {
    document.getElementById("tabs").innerHTML = "";
    renderGames();
    return;
  }

  // Tabs
  document.getElementById("tabs").innerHTML = familyMembers.map(m => `
    <button class="tab" data-tab="${m.id}" data-active="${activeTab === m.id}">
      <span>${m.emoji}</span><span>${m.name}</span>${m.age ? `<span class="age">(${m.age})</span>` : ""}
    </button>
  `).join("");

  const kid = activeTab;
  const isKid = kid === "zada" || kid === "kai";
  const catalog = books[kid] || [];
  const finished  = catalog.filter(b => getState(kid,b.title) === "finished");
  const reading   = catalog.filter(b => getState(kid,b.title) === "reading");
  const ordered   = catalog.filter(b => getState(kid,b.title) === "ordered");
  const selected  = catalog.filter(b => getState(kid,b.title) === "selected");
  const available = catalog.filter(b => getState(kid,b.title) === "available");

  const parts = [];

  // Currently Reading
  const currentCards = [];
  (inProgress[kid] || []).forEach(b => {
    const fmt = b.format && FORMAT[b.format] ? `<span class="badge ${FORMAT[b.format].cls}">${FORMAT[b.format].label}</span>` : "";
    currentCards.push(`
      <div class="card reading">
        <div class="row">
          <div>
            <p class="title">${escapeHtml(b.title)}</p>
            <p class="author">${escapeHtml(b.author)} • ${escapeHtml(b.status)}</p>
          </div>
          ${isKid && fmt ? `<div>${fmt}</div>` : ""}
        </div>
      </div>`);
  });
  reading.forEach(b => currentCards.push(bookCardHTML(b, kid, isKid)));
  parts.push(sectionHTML("Currently Reading", "reading", currentCards, "Nothing currently reading"));

  // Recently Finished (verdicts)
  const rf = recentlyFinished[kid] || [];
  if (rf.length) {
    const rfCards = rf.map(b => `
      <div class="card finished">
        <div class="row">
          <div style="flex:1;">
            <p class="title">${escapeHtml(b.title)}</p>
            <p class="author">${escapeHtml(b.author)}</p>
            <div class="verdictbox"><strong>${b.bounced ? "Bounced" : "Verdict"}:</strong> ${escapeHtml(b.verdict)}</div>
          </div>
        </div>
      </div>`).join("");
    parts.push(`
      <section>
        <h2 class="finished">Recently Finished</h2>
        ${rfCards}
      </section>`);
  }

  // Ordered
  if (ordered.length || isKid) {
    let inner = "";
    if (ordered.length) {
      inner += `<div class="librarian"><p class="lbl">📋 Show this to the librarian!</p><ul>` +
        ordered.map(b => `<li><span class="t">${escapeHtml(b.title)}</span><br><span class="a">${escapeHtml(b.author)}</span></li>`).join("") +
        `</ul></div>`;
      inner += ordered.map(b => bookCardHTML(b, kid, isKid)).join("");
    } else {
      inner = `<p class="empty">No books on order</p>`;
    }
    parts.push(`<section><h2 class="ordered">📋 Ordered from Library</h2>${inner}</section>`);
  }

  // Selected
  if (selected.length || isKid) {
    parts.push(sectionHTML("✓ Selected — Ready to Order", "selected",
      selected.map(b => bookCardHTML(b, kid, isKid)),
      "Select books from recommendations below!"));
  }

  // Recommended
  parts.push(sectionHTML("🎯 Recommended", "rec",
    available.map(b => bookCardHTML(b, kid, isKid)),
    "All recommendations selected or finished!"));

  // Finished (catalog-side, with ratings)
  if (finished.length) {
    parts.push(sectionHTML("⭐ Finished", "finished",
      finished.map(b => bookCardHTML(b, kid, isKid)), ""));
  }

  // Favorites chips
  if (favorites[kid]?.length) {
    parts.push(`
      <section>
        <h2 class="fav">🔥 All-Time Favorites</h2>
        <div class="favlist">${favorites[kid].map(f => `<span class="fav">${escapeHtml(f)}</span>`).join("")}</div>
      </section>`);
  }

  document.getElementById("content").innerHTML = parts.join("");
}

/* ============================================================
   EVENTS
   ============================================================ */

document.addEventListener("click", (e) => {
  const modeBtn = e.target.closest("[data-modebtn]");
  if (modeBtn) { activeMode = modeBtn.dataset.modebtn; save(); render(); return; }

  const tab = e.target.closest(".tab");
  if (tab && tab.dataset.tab) { activeTab = tab.dataset.tab; save(); render(); return; }

  const adv = e.target.closest("[data-advance]");
  if (adv) { setState(adv.dataset.kid, adv.dataset.title, adv.dataset.next); return; }

  const star = e.target.closest(".star");
  if (star) { setRating(star.dataset.kid, star.dataset.title, +star.dataset.star); return; }
});

render();
</script>
</body>
</html>
