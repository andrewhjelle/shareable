    .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.iv)},k,b(D.ct))})
    .then(function(p){var h=new TextDecoder().decode(p);if(ok)ok();document.open();document.write(h);document.close()});
}
function derive(pw){
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pw.trim().toLowerCase()),'PBKDF2',false,['deriveBits'])
    .then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',salt:b(D.salt),iterations:D.it,hash:'SHA-256'},k,256)});
}

});
var s=store(),saved=null;try{saved=s&&s.getItem(K)}catch(_){}
