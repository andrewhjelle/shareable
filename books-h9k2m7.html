<style>

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--tape);color:var(--ink);font:14px/1.5 "Zen Kaku Gothic New",system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--lip2);text-decoration:none;border-bottom:1px dotted rgba(194,79,61,.5)}

button{font:inherit;cursor:pointer}

/* scene */
.scene{position:fixed;inset:0;z-index:0;pointer-events:none}
.cel{position:absolute;inset:0;background:url("hub-cel-h9k2m7.jpg") 62% 18%/cover no-repeat;filter:saturate(.92) brightness(.9)}
.celscrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(23,20,26,.22) 0%,rgba(23,20,26,.5) 55%,rgba(23,20,26,.82) 100%),linear-gradient(180deg,rgba(23,20,26,0) 40%,rgba(23,20,26,.55) 100%)}
.vhs{position:fixed;inset:0;z-index:1;pointer-events:none}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 3px,rgba(10,8,12,.11) 3px 4px)}
.track{position:absolute;left:0;right:0;height:9px;background:linear-gradient(180deg,transparent,rgba(244,241,228,.1) 45%,rgba(244,241,228,.1) 55%,transparent);animation:trackmove 90s linear infinite}
.track.t2{height:5px;animation-duration:130s;animation-delay:-40s;opacity:.7}
@keyframes trackmove{from{top:-4%}to{top:104%}}
.grainsvg{position:absolute;inset:0;width:100%;height:100%;opacity:.55;mix-blend-mode:overlay}
@keyframes flutter{0%,97.4%,100%{transform:none}97.7%{transform:translateX(1px) skewX(.35deg)}98.1%{transform:translateX(-1px)}98.5%{transform:none}}
.scene .cel,.vhs .scan{animation:flutter 18s step-end infinite}
@media(prefers-reduced-motion:reduce){.track,.scene .cel,.vhs .scan{animation:none}}

/* nav */
.hubnav{position:sticky;top:0;z-index:50;background:rgba(33,29,32,.92);backdrop-filter:blur(6px);border-bottom:1px solid rgba(244,241,228,.18);display:flex;gap:2px;align-items:center;padding:8px 20px;font-family:"DotGothic16",monospace;letter-spacing:.14em;font-size:12px;text-transform:uppercase}
.hubnav a{color:var(--osd);text-decoration:none;padding:8px 14px;border-radius:2px;border:1px solid transparent;transition:color .15s,border-color .15s}
.hubnav a:hover{color:var(--skin);border-color:rgba(244,201,165,.4)}
.hubnav a.here{color:var(--skin);border-color:var(--skin)}
@media(max-width:720px){.hubnav{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:8px 12px}.hubnav::-webkit-scrollbar{display:none}.hubnav a{flex:0 0 auto;white-space:nowrap;padding:6px 10px}.hubnav .brand{margin-right:8px;padding-right:8px}}
.hubnav .brand{font-family:"Anton",sans-serif;font-size:18px;letter-spacing:.06em;color:#f4f1e4;margin-right:14px;padding-right:14px;border-right:1px solid rgba(244,241,228,.2)}

/* control bar */
.ctrl{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 22px;background:rgba(23,20,26,.78);border-bottom:1px solid rgba(244,241,228,.14)}
.ctrl .grp{display:flex;gap:6px;flex-wrap:wrap}
.osdbtn{font-family:"DotGothic16",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:transparent;color:var(--osd);border:1px solid rgba(244,241,228,.4);padding:4px 11px;border-radius:2px;transition:all .15s}
.osdbtn:hover{color:var(--skin);border-color:var(--skin)}
.osdbtn[data-active="true"]{background:var(--lip2);border-color:var(--lip2);color:var(--cream)}
.osdbtn[data-tab="zada"][data-active="true"]{background:var(--zada);border-color:var(--zada)}
.osdbtn[data-tab="kai"][data-active="true"]{background:var(--kai);border-color:var(--kai)}
.osdbtn[data-tab="andrew"][data-active="true"]{background:var(--andrew);border-color:var(--andrew)}
.osdbtn[data-tab="debbie"][data-active="true"]{background:var(--debbie);border-color:var(--debbie)}
.osdbtn[data-modebtn="games"][data-active="true"]{background:var(--games);border-color:var(--games)}
.osdbtn.ink{color:var(--ink);border-color:var(--ink);background:var(--cream2)}
.osdbtn.ink:hover{background:#fff;color:var(--lip2);border-color:var(--lip2)}

.mast{position:relative;z-index:2;max-width:1460px;margin:0 auto;padding:18px 22px 4px}
.mast h1{font-family:"Anton",sans-serif;font-size:clamp(34px,5vw,56px);letter-spacing:.02em;text-transform:uppercase;transform:skewX(-6deg);color:var(--skin);text-shadow:3px 0 0 rgba(194,79,61,.55),-3px 0 0 rgba(74,111,178,.45);line-height:1;margin-left:-4px}
.mast h1 i{font-style:normal;color:var(--lip)}
.mast .meta{font-family:"DotGothic16",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--osd);opacity:.75;margin-top:6px}

/* grid */
.cols{position:relative;z-index:2;max-width:1460px;margin:0 auto;padding:14px 22px 90px;display:grid;grid-template-columns:1fr;gap:18px;align-items:start}
@media(min-width:900px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.cols.detail{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)}}
.col{display:grid;gap:18px;min-width:0}

/* cards */
.card{position:relative;background:var(--cream);color:var(--ink);border:2.5px solid var(--ink);border-radius:3px 12px 4px 10px;padding:16px 18px 14px;box-shadow:5px 6px 0 rgba(33,29,32,.85)}
.card::before{content:"";position:absolute;inset:4px;border:1px solid var(--ink);opacity:.22;border-radius:2px 9px 3px 8px;pointer-events:none}
.card > *{position:relative}
.card h2{font-family:"Anton",sans-serif;font-size:clamp(20px,2.2vw,26px);letter-spacing:.02em;text-transform:uppercase;line-height:1.08;transform:skewX(-5deg);margin:0 0 4px}
.card h2 i{font-style:normal;color:var(--lip2)}
.card .meta{font-family:"DotGothic16",monospace;font-size:10.5px;letter-spacing:.1em;color:var(--mut);text-transform:uppercase;margin:0 0 6px}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:2px}
.phead h2{cursor:pointer}
.phead h2:hover{color:var(--lip2)}
.sub{font-family:"DotGothic16",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:12px 0 2px;padding-bottom:3px;border-bottom:1.5px solid rgba(33,29,32,.35)}
.empty{font-size:12.5px;color:var(--mut);font-style:italic;padding:6px 0}
.who{display:inline-block;font-family:"DotGothic16",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:1px 6px;border-radius:2px;color:var(--cream);background:var(--ink);white-space:nowrap;min-width:58px;text-align:center}
.who.zada{background:var(--zada)}.who.kai{background:var(--kai)}.who.andrew{background:var(--andrew)}.who.debbie{background:var(--debbie)}.who.games{background:var(--games)}

.rows{list-style:none}
.rows li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;padding:6px 0;border-top:1.5px dashed rgba(33,29,32,.35);align-items:baseline}
.rows li:first-child{border-top:0}
.rows .body{min-width:0}
.rows .t{font-weight:700;font-size:13.5px;line-height:1.3}
.rows .au{font-weight:400;color:var(--mut);font-size:12.5px}
.rows .st{font-family:"DotGothic16",monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--lip2);margin-top:1px}
.rows .when{font-family:"DotGothic16",monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);white-space:nowrap}
.rows li.x{cursor:pointer}
.rows li.x .t::after{content:" \203A";color:var(--mut)}
.rows li.x.open .t::after{content:" \2304";color:var(--lip2)}
.rows .more{display:none;grid-column:1/-1;font-size:12.5px;line-height:1.5;margin-top:4px;padding:8px 12px;background:var(--cream2);border:1.5px solid var(--ink);border-radius:2px 8px 3px 8px}
.rows li.open .more{display:block}
.rows .more.bounced{border-color:var(--signal)}
.favline{font-size:12.5px;line-height:1.45;color:var(--ink)}

.rank{list-style:none}
.rank li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;padding:6px 0;border-top:1.5px dashed rgba(33,29,32,.35);align-items:baseline}
.rank li:first-child{border-top:0}
.rank .n{font-family:"DotGothic16",monospace;font-size:11px;font-weight:700;color:var(--lip2);letter-spacing:.06em;padding-top:2px}
.rank .row{min-width:0;cursor:pointer;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.rank .rtitle{flex:1 1 auto;min-width:0;font-weight:700;font-size:13.5px;color:var(--ink);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .rtitle::after{content:" \203A";color:var(--mut);margin-left:2px;font-weight:400}
.rank li.open .rtitle::after{content:" \2304";color:var(--lip2)}
.rank .row:hover .rtitle{color:var(--lip2)}
.rank .rmeta{flex:0 0 auto;font-family:"DotGothic16",monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);white-space:nowrap}
.rank .rmeta .hi{color:var(--lip2);font-weight:700}
.rank .btn{flex:0 0 auto;font-family:"DotGothic16",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border:1.5px solid var(--ink);border-radius:2px 6px 2px 6px;background:var(--cream2);color:var(--ink)}
.rank .btn:hover{background:#fff;color:var(--lip2);border-color:var(--lip2)}
.rank .btn.selected{background:var(--cobalt);color:var(--cream);border-color:var(--cobalt)}
.rank .btn.ordered{background:var(--lip);color:var(--cream);border-color:var(--lip)}
.rank .btn.reading{background:var(--lip2);color:var(--cream);border-color:var(--lip2)}
.rank .btn.finished{background:var(--ink);color:var(--cream)}
.rank .rsub{flex-basis:100%;font-size:11.5px;line-height:1.4;color:var(--mut);margin-top:1px}
.rank .rsub b{font-weight:700;color:var(--ink)}
.rank .rsub i{font-style:normal;color:var(--cobalt)}
.rank .rwhy{display:none;flex-basis:100%;font-size:12.5px;line-height:1.5;margin-top:4px;padding:8px 12px;background:var(--cream2);border:1.5px solid var(--ink);border-radius:2px 8px 3px 8px}
.rank li.open .rwhy{display:block}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-family:"DotGothic16",monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border:1px solid rgba(33,29,32,.4);border-radius:2px;background:var(--cream);color:var(--ink);white-space:nowrap}
.tag.k{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.stars{margin-top:6px;display:flex;gap:2px;align-items:center}
.stars .lbl{font-family:"DotGothic16",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-right:6px}
.star{background:none;border:0;font-size:16px;color:rgba(33,29,32,.3);padding:0 1px;line-height:1}
.star.on{color:var(--lip2)}
.librarian{margin:6px 0 8px;padding:8px 12px;background:#fff;border:1.5px solid var(--ink);border-radius:2px 8px 3px 8px;font-size:12.5px}
.librarian .lbl{font-family:"DotGothic16",monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--lip2);margin-bottom:3px}
.librarian div{padding:1px 0}
.librarian .a{color:var(--mut)}
.tag.great{background:var(--lip2);color:var(--cream);border-color:var(--lip2)}
.tag.fit{color:var(--cobalt);border-color:var(--cobalt);background:transparent}
.tag.cut{color:var(--mut);border-color:rgba(33,29,32,.3);text-decoration:line-through}
.gaps{list-style:none;margin:0;padding:0}
.gaps li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:5px 0;border-top:1.5px dashed rgba(33,29,32,.35);align-items:baseline}
.gaps li:first-child{border-top:0}
.gaps .gt{font-weight:700;font-size:13px;color:var(--ink)}
.gaps .gt span{font-weight:400;color:var(--mut);font-size:12px}
.gaps .gw{grid-column:1/-1;font-size:12px;line-height:1.45;color:var(--ink)}
.gaps .gw i{font-style:normal;color:var(--cobalt)}
.rulebox{font-size:12.5px;line-height:1.5;padding:8px 12px;background:var(--cream2);border:1.5px solid var(--ink);border-radius:2px 8px 3px 8px;margin-top:6px}
.morelink{display:inline-block;margin-top:8px;font-family:"DotGothic16",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--lip2);border-bottom:1px dotted var(--lip2);cursor:pointer}
</style>

/* ============================================================
   STATE
   ============================================================ */
const STATE_KEY="familyBookStates", RATING_KEY="familyBookRatings", FIN_KEY="familyBookFinishedAt";
let activeMode=localStorage.getItem("familyMode")||"reading";
let activeTab=localStorage.getItem("familyActiveTab")||"";     // "" = overview (all four)
let bookStates=JSON.parse(localStorage.getItem(STATE_KEY)||"{}");
let bookRatings=JSON.parse(localStorage.getItem(RATING_KEY)||"{}");
let finishedAt=JSON.parse(localStorage.getItem(FIN_KEY)||"{}");
function save(){localStorage.setItem(STATE_KEY,JSON.stringify(bookStates));localStorage.setItem(RATING_KEY,JSON.stringify(bookRatings));localStorage.setItem(FIN_KEY,JSON.stringify(finishedAt));localStorage.setItem("familyActiveTab",activeTab);localStorage.setItem("familyMode",activeMode);}
function bookKey(k,t){return k+"|"+t}
function getState(k,t){return bookStates[bookKey(k,t)]||"available"}
function setState(k,t,s){bookStates[bookKey(k,t)]=s; if(s==="finished"){finishedAt[bookKey(k,t)]=new Date().toISOString().slice(0,7);} save();render()}
function getRating(k,t){return bookRatings[bookKey(k,t)]||0}
function setRating(k,t,r){const c=getRating(k,t);bookRatings[bookKey(k,t)]=(r===c?0:r);save();render()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const NEXT_STATE={available:{next:"selected",label:"Select",cls:"available"},selected:{next:"ordered",label:"Ordered",cls:"selected"},ordered:{next:"reading",label:"Reading",cls:"ordered"},reading:{next:"finished",label:"Finished",cls:"reading"},finished:{next:"available",label:"Reset",cls:"finished"}};
const FORMAT={novel:"Novel",graphic:"Graphic",manga:"Manga"};
const NAME=Object.fromEntries(familyMembers.map(m=>[m.id,m.name]));
const isKidOf=k=>(k==="zada"||k==="kai");

/* ============================================================
   PIECES
   ============================================================ */
function card(h2,inner,meta,extraHead){return '<article class="card"><div class="phead"><h2>'+h2+'</h2>'+(extraHead||'')+'</div>'+(meta?'<div class="meta">'+meta+'</div>':'')+inner+'</article>';}
function starsHTML(kid,title){const r=getRating(kid,title);let o='<div class="stars"><span class="lbl">Rate</span>';for(let i=1;i<=5;i++)o+='<button class="star '+(i<=r?'on':'')+'" data-star="'+i+'" data-kid="'+kid+'" data-title="'+esc(title)+'">&#9733;</button>';return o+'</div>';}
const TIER={great:'Great',fit:'Fit',cut:'Cut?'};
function tagsHTML(b,isKid){const t=[];if(b.tier&&TIER[b.tier])t.push('<span class="tag '+b.tier+'">'+TIER[b.tier]+'</span>');if(isKid&&b.format&&FORMAT[b.format])t.push('<span class="tag k">'+FORMAT[b.format]+'</span>');if(b.movieReward)t.push('<span class="tag k">Movie</span>');if(b.transgressive)t.push('<span class="tag k">Edgy</span>');if(b.audiobook)t.push('<span class="tag k">Audiobook</span>');(b.tags||[]).forEach(x=>t.push('<span class="tag">'+esc(x)+'</span>'));return t.length?'<div class="tags">'+t.join('')+'</div>':'';}
function queueRow(b,kid,n){
  const isKid=isKidOf(kid), state=getState(kid,b.title), conf=NEXT_STATE[state];
  const meta=[esc(b.author)]; if(b.match)meta.push('<span class="hi">'+esc(b.match)+'</span>'); if(b.pages)meta.push(esc(b.pages)); if(b.seriesInfo)meta.push(esc(b.seriesInfo));
  const lesson=LESSONS[b.title]?'<div class="rsub">'+LESSONS[b.title]+'</div>':'';
  const extra=(b.pitch?esc(b.pitch):'')+tagsHTML(b,isKid)+(state==='finished'?starsHTML(kid,b.title):'');
  return '<li class="q"><span class="n">'+n+'</span><div class="row"><div class="rtitle">'+esc(b.title)+'</div><div class="rmeta">'+meta.join(' &middot; ')+'</div>'
    +(isKid?'<button class="btn '+conf.cls+'" data-advance data-kid="'+kid+'" data-title="'+esc(b.title)+'" data-next="'+conf.next+'">'+conf.label+'</button>':'')
    +lesson+'<div class="rwhy">'+extra+'</div></div></li>';
}
function queueOf(kid){const cat=books[kid]||[];const by=s=>cat.filter(b=>getState(kid,b.title)===s);return {ordered:by('ordered'),selected:by('selected'),available:by('available'),reading:by('reading'),finished:by('finished'),all:[...by('ordered'),...by('selected'),...by('available')]};}
function readingRows(kid){
  const list=(inProgress[kid]||[]).map(b=>({title:b.title,author:b.author,status:b.status}));
  queueOf(kid).reading.forEach(b=>list.push({title:b.title,author:b.author,status:'From the queue'}));
  if(!list.length)return '<p class="empty">Nothing active.</p>';
  return '<ul class="rows">'+list.map(b=>'<li><span></span><div class="body"><div class="t">'+esc(b.title)+' <span class="au">'+esc(b.author)+'</span></div><div class="st">'+esc(b.status)+'</div></div><span></span></li>').join('')+'</ul>';
}
function finishedList(kid){
  const out=[];
  (recentlyFinished[kid]||[]).forEach(b=>{const m=(b.verdict||'').match(/(\d{4}-\d{2})/);out.push({title:b.title,author:b.author,when:m?m[1]:'',verdict:b.verdict,bounced:!!b.bounced});});
  queueOf(kid).finished.forEach(b=>out.push({title:b.title,author:b.author,when:finishedAt[bookKey(kid,b.title)]||'',verdict:b.pitch||'',stars:true}));
  return out;
}
function finishedRows(kid,limit){
  let list=finishedList(kid); if(limit)list=list.slice(0,limit);
  if(!list.length)return '<p class="empty">Nothing logged yet.</p>';
  return '<ul class="rows">'+list.map(b=>'<li class="x"><span></span><div class="body"><div class="t">'+esc(b.title)+' <span class="au">'+esc(b.author)+'</span></div><div class="st" style="color:'+(b.bounced?'var(--signal)':'var(--mut)')+'">'+(b.bounced?'Bounced':'Finished')+'</div></div><span class="when">'+(b.when||'&mdash;')+'</span><div class="more'+(b.bounced?' bounced':'')+'">'+esc(b.verdict||'')+(b.stars?starsHTML(kid,b.title):'')+'</div></li>').join('')+'</ul>';
}
function upNextRow(kid){const q=queueOf(kid).all;return q.length?'<ol class="rank">'+queueRow(q[0],kid,'&rarr;')+'</ol>':'<p class="empty">Queue is empty.</p>';}

function gapsHTML(){return GAPS.map(g=>'<div class="sub">'+g.lane+'</div><ul class="gaps">'+g.items.map(it=>'<li><div class="gt">'+it[0]+' <span>'+it[1]+'</span></div><span class="tag '+it[2]+'">'+TIER[it[2]]+'</span><div class="gw">'+it[3]+'</div></li>').join('')+'</ul>').join('');}
const LIKED={ andrew:["Dungeon Crawler Carl","Murderbot Diaries","Circe","Shadow of the Wind"] };
const NOTES={
  zada:"<b>Recalibrated Aug 22:</b> she says she doesn&rsquo;t like reading, then finishes Matilda (240 pp) and likes it. The early-reader picks (Dog Man, Bad Guys) bounced because they&rsquo;re too young, not because she can&rsquo;t. The year is now the Dahl run plus her Wednesday lane (The Witches, Bad Beginning, Coraline). The goal is still one book she loves; those three are the best bets. Quit-after-20-pages rule stays.",
  debbie:"Nothing active after Babel. Yellowface (same author) or My Cousin Rachel (couple read) are the two obvious next moves.",
  andrew:"Profile reviewed Aug 22 against the 226-book master list. Your real lane is Russian + Central European + Latin American (Dostoevsky &times;4, Kafka, Kundera, Klima, Bola&ntilde;o, Undset all 5s); the gothic queue below was built from three recent reads and is graded now: <b>Great</b> = canon, I&rsquo;d stake it; <b>Fit</b> = good, in your lane, not a masterpiece; <b>Cut?</b> = beneath the list. The full gap list is in your full view.",
};
function personCard(m){
  const kid=m.id, q=queueOf(kid), yr=q.all.filter(b=>b.year), rest=q.all.filter((b,i)=>!b.year&&i>0), top=rest.slice(0,10);
  let inner='';
  if(NOTES[kid]) inner+='<div class="rulebox" style="margin-top:4px">'+NOTES[kid]+'</div>';
  inner+='<div class="sub">Reading</div>'+readingRows(kid);
  inner+='<div class="sub">Up next</div>'+upNextRow(kid);
  if(yr.length) inner+='<div class="sub">This year &middot; 2026&ndash;27 &middot; '+yr.length+' books</div><ol class="rank">'+yr.map((b,i)=>queueRow(b,kid,i+1)).join('')+'</ol>';
  inner+='<div class="sub">'+(yr.length?'Everything else':'Queue')+' &middot; top '+top.length+' of '+q.all.length+'</div>'+(top.length?'<ol class="rank">'+top.map((b,i)=>queueRow(b,kid,i+2)).join('')+'</ol>':'<p class="empty">That&rsquo;s the whole queue.</p>');
  if(q.all.length>11) inner+='<span class="morelink" data-open="'+kid+'">Full queue ('+q.all.length+') &rsaquo;</span>';
  inner+='<div class="sub">Last 3 finished</div>'+finishedRows(kid,3);
  return '<article class="card person"><div class="phead"><h2 data-open="'+kid+'"><span class="who '+kid+'">'+m.name+'</span> '+m.name+(m.age?' <i>('+m.age+')</i>':'')+'</h2><button class="osdbtn ink" data-open="'+kid+'">Full view &rsaquo;</button></div>'+inner+'</article>';
}
function renderOverview(){
  document.getElementById('cols').classList.remove('detail');
  document.getElementById('pageTitle').innerHTML='Books';
  const order=['zada','andrew','kai','debbie'].map(id=>familyMembers.find(m=>m.id===id));
  document.getElementById('left').innerHTML=personCard(order[0])+personCard(order[1]);
  document.getElementById('right').innerHTML=personCard(order[2])+personCard(order[3]);
}

/* ============================================================
   PERSON — full view
   ============================================================ */
function renderPerson(kid){
  document.getElementById('cols').classList.add('detail');
  const m=familyMembers.find(x=>x.id===kid), isKid=isKidOf(kid), q=queueOf(kid), who=m.name;
  document.getElementById('pageTitle').innerHTML=who+'&rsquo;s <i>books</i>';
  const back='<button class="osdbtn ink" data-open="">&lsaquo; All</button>';
  let L='';
  L+=card('<span class="who '+kid+'">'+who+'</span> Reading',readingRows(kid),null,back);
  L+=card('Up next',upNextRow(kid),'Top of the queue &middot; tap for the pitch');
  const yr=q.all.filter(b=>b.year); if(yr.length) L+=card('This <i>year</i>','<ol class="rank">'+yr.map((b,i)=>queueRow(b,kid,i+1)).join('')+'</ol>','2026&ndash;27 reading year &middot; the schedule is on the <a href="kids-h9k2m7.html#books">Kids</a> page');
  L+=card('Recently finished',finishedRows(kid,5),'Tap a row for the verdict');
  const allFin=finishedList(kid);
  if(allFin.length>5) L+=card('Finished',finishedRows(kid),allFin.length+' total');
  if((favorites[kid]||[]).length) L+=card('All-time favorites','<p class="favline">'+favorites[kid].map(esc).join(' &middot; ')+'</p>'+((LIKED[kid]||[]).length?'<div class="sub">Liked, not favorites</div><p class="favline">'+LIKED[kid].map(esc).join(' &middot; ')+'</p>':''));
  let R='';
  if(q.ordered.length){R+='<div class="sub">Ordered from the library</div>';if(isKid)R+='<div class="librarian"><div class="lbl">Show this to the librarian</div>'+q.ordered.map(b=>'<div><b>'+esc(b.title)+'</b> <span class="a">'+esc(b.author)+'</span></div>').join('')+'</div>';R+='<ol class="rank">'+q.ordered.map((b,i)=>queueRow(b,kid,i+1)).join('')+'</ol>';}
  if(q.selected.length)R+='<div class="sub">Selected &middot; ready to order</div><ol class="rank">'+q.selected.map((b,i)=>queueRow(b,kid,i+1)).join('')+'</ol>';
  R+='<div class="sub">Recommended &middot; ranked</div>'+(q.available.length?'<ol class="rank">'+q.available.map((b,i)=>queueRow(b,kid,i+1)).join('')+'</ol>':'<p class="empty">All selected or finished.</p>');
  document.getElementById('left').innerHTML=L;
  document.getElementById('right').innerHTML=card('Full queue',R,q.all.length+' books &middot; tap a row for the pitch'+(isKid?' &middot; buttons walk it to the library':''))
    +(kid==='andrew'?card('Gaps <i>graded</i>',gapsHTML(),'From the 226-book master list (which is missing some reads; say so and I&rsquo;ll drop them) &middot; Great = I&rsquo;d stake it &middot; Fit = good and in your lane, not canon'):'');
}

/* ============================================================
   GAME NIGHTS
   ============================================================ */
function gameRow(g,n){
  const state=getState('games',g.title), conf=GAME_NEXT[state];
  const extra=esc(g.pitch)+'<div class="tags"><span class="tag k">Crossplay</span><span class="tag k">'+esc(g.players)+'</span>'+(g.tags||[]).map(x=>'<span class="tag">'+esc(x)+'</span>').join('')+'</div>'+(state==='played'?starsHTML('games',g.title):'');
  return '<li class="q"><span class="n">'+n+'</span><div class="row"><div class="rtitle">'+esc(g.title)+'</div><div class="rmeta"><span class="hi">'+esc(g.price)+'</span></div><button class="btn '+conf.cls+'" data-advance data-kid="games" data-title="'+esc(g.title)+'" data-next="'+conf.next+'">'+conf.label+'</button><div class="rwhy">'+extra+'</div></div></li>';
}
function renderGames(){
  document.getElementById('cols').classList.add('detail');
  document.getElementById('pageTitle').innerHTML='Game <i>nights</i>';
  const crewRows='<ul class="rows">'+crew.map(c=>'<li><span class="who games">'+esc(c.name)+'</span><div class="body"><div class="t" style="font-weight:400">'+esc(c.platforms)+'</div></div><span></span></li>').join('')+'</ul><div class="rulebox">'+esc(crewRule)+'</div>';
  const played='<ul class="rows">'+gamesPlayed.map(g=>'<li class="x"><span class="who games">'+(g.warn?'Heads up':'Played')+'</span><div class="body"><div class="t">'+esc(g.title)+'</div></div><span></span><div class="more'+(g.warn?' bounced':'')+'">'+esc(g.note)+'</div></li>').join('')+'</ul>';
  const dead='<ul class="rows">'+gamesDead.map(d=>'<li class="x"><span class="who">Parked</span><div class="body"><div class="t">'+esc(d.title)+'</div></div><span></span><div class="more">'+esc(d.why)+'</div></li>').join('')+'</ul>';
  document.getElementById('left').innerHTML=card('The crew',crewRows,'Andrew &middot; Jason &middot; Brian')+card('Played together',played,'Tap for notes')+card('Ruled out / parked',dead,'Tap for why');
  const by=s=>games.filter(g=>getState('games',g.title)===s);
  const playing=by('playing'),short=by('shortlist'),avail=by('available'),done=by('played');
  let q='';
  if(playing.length)q+='<div class="sub">Currently playing</div><ol class="rank">'+playing.map((g,i)=>gameRow(g,i+1)).join('')+'</ol>';
  if(short.length)q+='<div class="sub">Shortlist &middot; next game night</div><ol class="rank">'+short.map((g,i)=>gameRow(g,i+1)).join('')+'</ol>';
  q+='<div class="sub">Recommended</div>'+(avail.length?'<ol class="rank">'+avail.map((g,i)=>gameRow(g,i+1)).join('')+'</ol>':'<p class="empty">All shortlisted or played.</p>');
  if(done.length)q+='<div class="sub">Played</div><ol class="rank">'+done.map((g,i)=>gameRow(g,i+1)).join('')+'</ol>';
  document.getElementById('right').innerHTML=card('Queue',q,'Tap a row for the pitch &middot; buttons walk it to played');
}

function render(){
  document.getElementById('lastUpdated').textContent='Last updated '+LAST_UPDATED;
  document.getElementById('modeToggle').innerHTML='<button class="osdbtn" data-modebtn="reading" data-active="'+(activeMode==='reading')+'">Reading</button><button class="osdbtn" data-modebtn="games" data-active="'+(activeMode==='games')+'">Game nights</button>';
  if(activeMode==='games'){document.getElementById('tabs').innerHTML='';renderGames();return;}
  document.getElementById('tabs').innerHTML='<button class="osdbtn" data-tab="" data-active="'+(activeTab==='')+'">All</button>'+familyMembers.map(m=>'<button class="osdbtn" data-tab="'+m.id+'" data-active="'+(activeTab===m.id)+'">'+m.name+'</button>').join('');
  if(activeTab&&NAME[activeTab])renderPerson(activeTab);else renderOverview();
}
document.addEventListener('click',e=>{
  const mb=e.target.closest('[data-modebtn]');if(mb){activeMode=mb.dataset.modebtn;save();render();return;}
  const tb=e.target.closest('[data-tab]');if(tb){activeTab=tb.dataset.tab;save();render();window.scrollTo(0,0);return;}
  const op=e.target.closest('[data-open]');if(op){activeTab=op.dataset.open;save();render();window.scrollTo(0,0);return;}
  const adv=e.target.closest('[data-advance]');if(adv){setState(adv.dataset.kid,adv.dataset.title,adv.dataset.next);return;}
  const st=e.target.closest('.star');if(st){setRating(st.dataset.kid,st.dataset.title,+st.dataset.star);return;}
  const row=e.target.closest('.rank .row');if(row){row.parentElement.classList.toggle('open');return;}
  const x=e.target.closest('.rows li.x');if(x){x.classList.toggle('open');return;}
});
render();
</script>
