/* ============================================================
   GAME NIGHTS — Andrew + Jason + Brian
   Platform rule: Andrew = PC only · Brian = PS5 + PC · Jason = Xbox
   (maybe a PS5 somewhere). Safe zone = FULL PC/Xbox/PS5 crossplay.
   Jason: no fantasy.
   ============================================================ */

const crew = [
  { name: "Andrew", platforms: "PC only" },
  { name: "Brian",  platforms: "PS5 + PC" },
  { name: "Jason",  platforms: "Xbox + VR headset + probably a PC (Darktide? Fireteam?) — confirm" },
];
const crewRule = "Everything below is PvE co-op with crossplay covering this exact crew — nobody has to buy hardware, nobody gets hunted by sweatlords. Jason rule: hangout games or space/future settings ONLY (no fantasy, no modern-day tactical, no pirates — Remnant field-tested this). Voice: Discord runs natively on Xbox, PS5, and PC. Phasmophobia is the one game here with VRChat-grade proximity voice built in.";

/* Already played together. */
const gamesPlayed = [

  { title: "Helldivers 2",   note: "Pure PvE and the Xbox version (Aug 2025) means all three of you can squad with full crossplay now. The #1 pick for the next PvE night — you already own it and like it." },

];

/* Recommendations — Jason filter: hangout OR space/future only.
   State machine: available → shortlist → playing → played. */
const games = [
  { title: "Borderlands 4", price: "Jason owns it · Andrew waiting on sale", players: "4-player co-op",
    tags: ["PvE","Space/Future ✓","You Loved BL3","Safest Bet"],
    pitch: "The crew loved BL3 and Jason already owns this one. Andrew: grab it on sale (watch Steam sales — it's hit ~$45). Brian needs a copy too. Same co-op campaign loop as BL3, bigger, full crossplay from day one. The closest thing to a guaranteed hit here." },
  { title: "Warhammer 40K: Darktide", price: "$40 (Brian only)", players: "4-player co-op",
    tags: ["PvE","Space/Future ✓","2 of 3 Already Own It","Space Marine 2 Energy"],
    pitch: "Andrew + Jason already own it (Jason's copy may be PC — irrelevant, crossplay is full, everyone lands in the same lobby). Brian is the only buy: $40 on PS5 or PC, or included with PC Game Pass. Cheapest real next step after Helldivers." },
  { title: "Killing Floor 3", price: "$40", players: "6-player co-op",

  { title: "Overcooked! All You Can Eat", price: "$40 (often ~$15)", players: "4-player co-op",
    tags: ["Hangout ✓","Chaotic Kitchen Co-op","Friendship Stress Test"],
    pitch: "Cooperative kitchen chaos — the classic scream-at-each-other-laughing game. The All You Can Eat edition has full crossplay across PC/PS5/Xbox." },
  { title: "Phasmophobia", price: "$20", players: "4-player co-op",
    tags: ["Hangout-ish","Built-in Proximity Voice","Jason-Check: Paranormal ≠ Space"],

];

/* Ruled out — platform walls or PvP. Kept so nobody re-litigates them. */
const gamesDead = [
  { title: "Remnant", why: "Played it — Jason didn't like it. Confirmed the rule: nothing soulslike or dark-fantasy." },
  { title: "Warframe", why: "Tried it — never truly clicked. The free-to-play grind needs a wiki guy nobody wanted to be. Not worth a third attempt." },
  { title: "Ready or Not / Payday 3", why: "Cut by the Jason filter — modern-day tactical/crime, not hangout or space/future. (GTA Online worked because it was a hangout sandbox, not a mission grind.)" },
  { title: "Sea of Thieves", why: "Cut by the Jason filter — pirates are the wrong century entirely." },
  { title: "Destiny 2", why: "Jason and Brian played it; Andrew couldn't get into it. Two of three isn't a crew game." },

  { title: "ARC Raiders", why: "PvPvE — other player squads hunt you in every raid. Great game, wrong vibe for a PvE crew." },
  { title: "Battlefield 6 / Warzone / Rocket League", why: "Parked — PvP, not the vibe right now." },
  { title: "Grounded", why: "Andrew likes it, but survival-building probably isn't Jason's wheelhouse. Parked for this crew — could be a different-friends or family game." },
  { title: "Deep Rock Galactic", why: "The perfect PvE game on paper, but Steam PC can't join consoles (only Microsoft Store PC ↔ Xbox). Verified 2026-07." },
  { title: "Lethal Company / R.E.P.O. / Content Warning", why: "The proximity-voice co-op hits are all PC only." },
  { title: "Hell Let Loose", why: "Console-to-console crossplay only — PC is walled off." },
];

const GAME_NEXT = {
  available: { next: "shortlist", label: "Shortlist",   cls: "available" },
  shortlist: { next: "playing",   label: "We Got It",   cls: "selected"  },
  playing:   { next: "played",    label: "Mark Played", cls: "reading"   },
  played:    { next: "available", label: "Reset",       cls: "finished"  },
};

/* ============================================================
   STATE
   ============================================================ */
const STATE_KEY  = "familyBookStates";
const RATING_KEY = "familyBookRatings";
let activeMode  = localStorage.getItem("familyMode") || "reading";
let activeTab   = localStorage.getItem("familyActiveTab") || "andrew";
let bookStates  = JSON.parse(localStorage.getItem(STATE_KEY)  || "{}");
let bookRatings = JSON.parse(localStorage.getItem(RATING_KEY) || "{}");
function save(){ localStorage.setItem(STATE_KEY,JSON.stringify(bookStates)); localStorage.setItem(RATING_KEY,JSON.stringify(bookRatings)); localStorage.setItem("familyActiveTab",activeTab); localStorage.setItem("familyMode",activeMode); }
function bookKey(k,t){return k+"|"+t}
function getState(k,t){return bookStates[bookKey(k,t)]||"available"}
function setState(k,t,s){bookStates[bookKey(k,t)]=s;save();render()}
function getRating(k,t){return bookRatings[bookKey(k,t)]||0}
function setRating(k,t,r){const c=getRating(k,t);bookRatings[bookKey(k,t)]=(r===c?0:r);save();render()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

const NEXT_STATE = {
  available:{next:"selected",label:"Select",cls:"available"},
  selected:{next:"ordered",label:"Ordered",cls:"selected"},
  ordered:{next:"reading",label:"Reading",cls:"ordered"},
  reading:{next:"finished",label:"Finished",cls:"reading"},
  finished:{next:"available",label:"Reset",cls:"finished"},
};
const FORMAT = { novel:"Novel", graphic:"Graphic", manga:"Manga" };
const NAME = Object.fromEntries(familyMembers.map(m=>[m.id,m.name]));

/* ============================================================
   PIECES
   ============================================================ */
function card(ep, h2, inner, meta){
  return '<article class="card"><span class="ep">'+ep+'</span><h2>'+h2+'</h2>'+(meta?'<div class="meta">'+meta+'</div>':'')+inner+'</article>';
}
function starsHTML(kid,title){
  const r=getRating(kid,title); let o='<div class="stars"><span class="lbl">Rate</span>';
  for(let i=1;i<=5;i++) o+='<button class="star '+(i<=r?'on':'')+'" data-star="'+i+'" data-kid="'+kid+'" data-title="'+esc(title)+'">&#9733;</button>';
  return o+'</div>';
}
function tagsHTML(b,isKid){
  const t=[];
  if(isKid&&b.format&&FORMAT[b.format]) t.push('<span class="tag k">'+FORMAT[b.format]+'</span>');
  if(b.movieReward) t.push('<span class="tag k">Movie</span>');
  if(b.transgressive) t.push('<span class="tag k">Edgy</span>');
  if(b.audiobook) t.push('<span class="tag k">Audiobook</span>');
  (b.tags||[]).forEach(x=>t.push('<span class="tag">'+esc(x)+'</span>'));
  return t.length?'<div class="tags">'+t.join('')+'</div>':'';
}
function queueRow(b,kid,isKid,n){
  const state=getState(kid,b.title), conf=NEXT_STATE[state];
  const meta=[esc(b.author)];
  if(b.match) meta.push('<span class="hi">'+esc(b.match)+'</span>');
  if(b.pages) meta.push(esc(b.pages));
  if(b.seriesInfo) meta.push(esc(b.seriesInfo));
  const extra=(b.pitch?esc(b.pitch):'')+tagsHTML(b,isKid)+(state==='finished'?starsHTML(kid,b.title):'');
  return '<li class="q" data-kid="'+kid+'" data-title="'+esc(b.title)+'"><span class="n">'+n+'</span><div class="row">'
    +'<div class="rtitle">'+esc(b.title)+'</div><div class="rmeta">'+meta.join(' &middot; ')+'</div>'
    +(isKid?'<button class="btn '+conf.cls+'" data-advance data-kid="'+kid+'" data-title="'+esc(b.title)+'" data-next="'+conf.next+'">'+conf.label+'</button>':'')
    +'<div class="rwhy">'+extra+'</div></div></li>';
}
function gameRow(g,n){
  const state=getState('games',g.title), conf=GAME_NEXT[state];
  const extra=esc(g.pitch)+'<div class="tags"><span class="tag k">Crossplay</span><span class="tag k">'+esc(g.players)+'</span>'+(g.tags||[]).map(x=>'<span class="tag">'+esc(x)+'</span>').join('')+'</div>'+(state==='played'?starsHTML('games',g.title):'');
  return '<li class="q"><span class="n">'+n+'</span><div class="row"><div class="rtitle">'+esc(g.title)+'</div><div class="rmeta"><span class="hi">'+esc(g.price)+'</span></div>'
    +'<button class="btn '+conf.cls+'" data-advance data-kid="games" data-title="'+esc(g.title)+'" data-next="'+conf.next+'">'+conf.label+'</button>'
    +'<div class="rwhy">'+extra+'</div></div></li>';
}

/* ============================================================
   READING MODE
   ============================================================ */
function renderReading(){
  document.getElementById('pageTitle').innerHTML='Family <i>reading</i>';
  document.getElementById('tabs').innerHTML=familyMembers.map(m=>'<button class="osdbtn" data-tab="'+m.id+'" data-active="'+(activeTab===m.id)+'">'+m.name+(m.age?' ('+m.age+')':'')+'</button>').join('');

  /* LEFT — everyone at once */
  let now='<ul class="rows">';
  familyMembers.forEach(m=>{
    const list=(inProgress[m.id]||[]).slice();
    (books[m.id]||[]).filter(b=>getState(m.id,b.title)==='reading').forEach(b=>list.push({title:b.title,author:b.author,status:'From the queue'}));
    if(!list.length){ now+='<li><span class="who '+m.id+'">'+m.name+'</span><div class="body"><div class="t" style="font-weight:400;color:var(--mut)">Nothing active</div></div></li>'; return; }
    list.forEach((b,i)=>{ now+='<li>'+(i===0?'<span class="who '+m.id+'">'+m.name+'</span>':'<span></span>')+'<div class="body"><div class="t">'+esc(b.title)+' <span class="au">'+esc(b.author)+'</span></div><div class="st">'+esc(b.status)+'</div></div></li>'; });
  });
  now+='</ul>';

  let fin='<ul class="rows">'; let anyFin=false;
  familyMembers.forEach(m=>{
    (recentlyFinished[m.id]||[]).forEach(b=>{ anyFin=true; fin+='<li class="x"><span class="who '+m.id+'">'+m.name+'</span><div class="body"><div class="t">'+esc(b.title)+' <span class="au">'+esc(b.author)+'</span></div><div class="st" style="color:'+(b.bounced?'var(--signal)':'var(--mut)')+'">'+(b.bounced?'Bounced':'Finished')+'</div></div><div class="more'+(b.bounced?' bounced':'')+'">'+esc(b.verdict)+'</div></li>'; });
    (books[m.id]||[]).filter(b=>getState(m.id,b.title)==='finished').forEach(b=>{ anyFin=true; fin+='<li class="x"><span class="who '+m.id+'">'+m.name+'</span><div class="body"><div class="t">'+esc(b.title)+' <span class="au">'+esc(b.author)+'</span></div><div class="st">Finished &middot; from the queue</div></div><div class="more">'+(b.pitch?esc(b.pitch):'')+starsHTML(m.id,b.title)+'</div></li>'; });
  });
  fin+='</ul>'; if(!anyFin) fin='<p class="empty">Nothing logged yet.</p>';

  let fav='<ul class="rows">';
  familyMembers.forEach(m=>{ if((favorites[m.id]||[]).length) fav+='<li><span class="who '+m.id+'">'+m.name+'</span><div class="body favline">'+favorites[m.id].map(esc).join(' &middot; ')+'</div></li>'; });
  fav+='</ul>';

  document.getElementById('left').innerHTML=
    card('NOW READING &middot; EVERYONE','On the <i>nightstand</i>',now)+
    card('RECENTLY FINISHED','Verdicts <i>in</i>',fin,'Tap a row for the verdict')+
    card('TASTE DNA','All-time <i>favorites</i>',fav);

  /* RIGHT — the per-person queue */
  const kid=activeTab, isKid=(kid==='zada'||kid==='kai'), cat=books[kid]||[];
  const by=s=>cat.filter(b=>getState(kid,b.title)===s);
  const ordered=by('ordered'), selected=by('selected'), avail=by('available');
  let q='';
  if(ordered.length){
    q+='<div class="sub">Ordered from the library</div>';
    if(isKid) q+='<div class="librarian"><div class="lbl">Show this to the librarian</div>'+ordered.map(b=>'<div><b>'+esc(b.title)+'</b> <span class="a">'+esc(b.author)+'</span></div>').join('')+'</div>';
    q+='<ol class="rank">'+ordered.map((b,i)=>queueRow(b,kid,isKid,i+1)).join('')+'</ol>';
  }
  if(selected.length){ q+='<div class="sub">Selected &middot; ready to order</div><ol class="rank">'+selected.map((b,i)=>queueRow(b,kid,isKid,i+1)).join('')+'</ol>'; }
  q+='<div class="sub">Recommended &middot; ranked</div>';
  q+=avail.length?'<ol class="rank">'+avail.map((b,i)=>queueRow(b,kid,isKid,i+1)).join('')+'</ol>':'<p class="empty">All selected or finished.</p>';
  const who=NAME[kid]||kid;
  document.getElementById('right').innerHTML=card('QUEUE &middot; <span class="who '+kid+'">'+who+'</span>', who+'&rsquo;s <i>queue</i>', q, 'Tap a row for the pitch'+(isKid?' &middot; buttons walk it to the library':''));
}

/* ============================================================
   GAME NIGHTS MODE
   ============================================================ */
function renderGames(){
  document.getElementById('pageTitle').innerHTML='Game <i>nights</i>';
  document.getElementById('tabs').innerHTML='';
  let crewRows='<ul class="rows">'+crew.map(c=>'<li><span class="who games">'+esc(c.name)+'</span><div class="body"><div class="t" style="font-weight:400">'+esc(c.platforms)+'</div></div></li>').join('')+'</ul><div class="rulebox">'+esc(crewRule)+'</div>';
  let played='<ul class="rows">'+gamesPlayed.map(g=>'<li class="x"><span class="who games">'+(g.warn?'Heads up':'Played')+'</span><div class="body"><div class="t">'+esc(g.title)+'</div></div><div class="more'+(g.warn?' bounced':'')+'">'+esc(g.note)+'</div></li>').join('')+'</ul>';
  let dead='<ul class="rows">'+gamesDead.map(d=>'<li class="x"><span class="who">Parked</span><div class="body"><div class="t">'+esc(d.title)+'</div></div><div class="more">'+esc(d.why)+'</div></li>').join('')+'</ul>';
  document.getElementById('left').innerHTML=
    card('THE CREW','Who&rsquo;s <i>on</i>',crewRows,'Andrew &middot; Jason &middot; Brian')+
    card('PLAYED TOGETHER','Already <i>done</i>',played,'Tap for notes')+
    card('RULED OUT / PARKED','Don&rsquo;t <i>re-litigate</i>',dead,'Tap for why');

  const by=s=>games.filter(g=>getState('games',g.title)===s);
  const playing=by('playing'), short=by('shortlist'), avail=by('available'), done=by('played');
  let q='';
  if(playing.length) q+='<div class="sub">Currently playing</div><ol class="rank">'+playing.map((g,i)=>gameRow(g,i+1)).join('')+'</ol>';
  if(short.length) q+='<div class="sub">Shortlist &middot; next game night</div><ol class="rank">'+short.map((g,i)=>gameRow(g,i+1)).join('')+'</ol>';
  q+='<div class="sub">Recommended</div>'+(avail.length?'<ol class="rank">'+avail.map((g,i)=>gameRow(g,i+1)).join('')+'</ol>':'<p class="empty">All shortlisted or played.</p>');
  if(done.length) q+='<div class="sub">Played</div><ol class="rank">'+done.map((g,i)=>gameRow(g,i+1)).join('')+'</ol>';
  document.getElementById('right').innerHTML=card('QUEUE &middot; GAME NIGHTS','The <i>queue</i>',q,'Tap a row for the pitch &middot; buttons walk it to played');
}

function render(){
  document.getElementById('lastUpdated').textContent='Last updated '+LAST_UPDATED;
  document.getElementById('modeToggle').innerHTML=
    '<button class="osdbtn" data-modebtn="reading" data-active="'+(activeMode==='reading')+'">Reading</button>'+
    '<button class="osdbtn" data-modebtn="games" data-active="'+(activeMode==='games')+'">Game nights</button>';
  if(activeMode==='games') renderGames(); else renderReading();
}

document.addEventListener('click',e=>{
  const mb=e.target.closest('[data-modebtn]'); if(mb){activeMode=mb.dataset.modebtn;save();render();return;}
  const tb=e.target.closest('[data-tab]'); if(tb){activeTab=tb.dataset.tab;save();render();return;}
  const adv=e.target.closest('[data-advance]'); if(adv){setState(adv.dataset.kid,adv.dataset.title,adv.dataset.next);return;}
  const st=e.target.closest('.star'); if(st){setRating(st.dataset.kid,st.dataset.title,+st.dataset.star);return;}
  const row=e.target.closest('.rank .row'); if(row){row.parentElement.classList.toggle('open');return;}
  const x=e.target.closest('.rows li.x'); if(x){x.classList.toggle('open');return;}
});
render();
</script>
