const $=id=>document.getElementById(id);
function b2u(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
function u2b(u){let s="";u.forEach(c=>s+=String.fromCharCode(c));return btoa(s);}
const RAW=b2u(BLOB), SALT=RAW.slice(0,16), IV=RAW.slice(16,28), CT=RAW.slice(28);
async function open_(keyRaw, remember){
  const k=await crypto.subtle.importKey("raw",keyRaw,"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:IV},k,CT);
  if(remember){try{localStorage.setItem(LS,u2b(new Uint8Array(keyRaw)))}catch(e){}}
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
(async()=>{

    if(saved){await open_(b2u(saved).buffer,false);return;}
  }catch(e){try{localStorage.removeItem(LS)}catch(_){}}

})();
$("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const go=$("go");go.disabled=true;go.textContent="Unlocking\u2026";$("err").textContent="";
  try{
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode($("pw").value),"PBKDF2",false,["deriveBits"]);

});
