<title>House projects</title>
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#faf9f6;color:#20242a;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme:dark){body{background:#15181b;color:#e7e5e0}
    .card{background:#1b1f23 !important;border-color:#2c3237 !important}
    input{background:#15181b !important;color:#e7e5e0 !important;border-color:#2c3237 !important}}
  .card{background:#fff;border:1px solid #e4e0d8;border-radius:14px;padding:34px 30px;
    max-width:390px;width:calc(100% - 40px);text-align:center;
    box-shadow:0 1px 3px rgba(0,0,0,.04),0 12px 32px rgba(0,0,0,.06)}
  h1{font:600 25px/1.2 Georgia,serif;margin:0 0 6px}
  p{margin:0 0 20px;font-size:14px;color:#8a929c}
  input{width:100%;padding:12px 14px;font-size:16px;border:1px solid #e4e0d8;border-radius:8px;
    background:#faf9f6;text-align:center;letter-spacing:.06em}
  button{margin-top:12px;width:100%;padding:12px;font:600 15px inherit;color:#fff;background:#1d5b73;
    border:0;border-radius:8px;cursor:pointer}
  button:disabled{opacity:.55}
  .err{color:#9c4221;font-size:13.5px;min-height:19px;margin:12px 0 0}
</style>
</head>

</div>

function b2u(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
function u2b(u){let s="";u.forEach(c=>s+=String.fromCharCode(c));return btoa(s);}
const RAW=b2u(BLOB), SALT=RAW.slice(0,16), IV=RAW.slice(16,28), CT=RAW.slice(28);
async function open_(keyRaw, remember){
  const k=await crypto.subtle.importKey("raw",keyRaw,"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:IV},k,CT);

  document.open();document.write(html);document.close();
}

})();
